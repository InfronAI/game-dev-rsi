name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/rsi.py doctor --case cases/relay-vault
      - run: node --test tests/rules.test.mjs
      - run: python3 -m unittest discover -s tests -v
      - run: python3 examples/demo.py
      - run: python3 tools/rsi.py showcase
      - run: python3 tests/browser_smoke.py --game experiments/scripted-demo/none/relay-vault/demo/rounds/round-0003/artifact/index.html --replay experiments/scripted-demo/none/relay-vault/demo/rounds/round-0001/evidence/attempt-001/wall-bump-1.html
